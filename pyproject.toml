[project]
name = "xem-ngay"
version = "0.4.0"
description = "Tử Bình Gia Đình V1 - lịch pháp, hồ sơ và khung đánh giá thời điểm có truy nguồn"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "astronomy-engine>=2.1",
  "pymeeus>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["kiem_thu"]
