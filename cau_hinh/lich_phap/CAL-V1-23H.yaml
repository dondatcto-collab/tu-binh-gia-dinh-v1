name_vi: "Bộ quy ước lịch V1, đổi ngày lúc 23 giờ"
status: EXPERIMENTAL
is_default: false
source_id: null
notes: >
  Giống CAL-V1 ở mọi điểm, chỉ khác mốc đổi ngày.
  Dùng để nghiên cứu quy tắc đổi ngày đầu giờ Tý.
  Không được bật làm mặc định khi chưa có ca vàng đã duyệt.

