name: Live smoke production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Smoke production contracts
        env:
          BASE_URL: https://tu-binh-gia-dinh-v1.vercel.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          profile = {
              'profile_id': 'SMOKE-050', 'full_name': 'Ho So Kiem Thu', 'gender': 'NAM',
              'birth': {'year': 1990, 'month': 1, 'day': 15, 'hour': 8, 'minute': 0},
              'birth_place_text': 'Can Tho', 'timezone_name': 'Asia/Ho_Chi_Minh',
              'time_certainty': 'KNOWN', 'note': 'Automated production smoke test',
          }

          def req(path, payload=None, attempts=6, pause=10):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {'Accept': 'application/json'}
              if body is not None: headers['Content-Type'] = 'application/json'
              last = None
              for i in range(attempts):
                  try:
                      r = urllib.request.Request(base + path, data=body, headers=headers,
                                                 method='GET' if body is None else 'POST')
                      with urllib.request.urlopen(r, timeout=90) as x:
                          assert x.status == 200, (path, x.status)
                          return json.loads(x.read().decode())
                  except Exception as exc:
                      last = exc
                      if i + 1 < attempts: time.sleep(pause)
              raise AssertionError(f'{path}: {last}')

          def wait_for_contract(path, predicate, attempts=18, pause=10):
              last = None
              for i in range(attempts):
                  try:
                      last = req(path, attempts=1)
                      if predicate(last): return last
                  except Exception as exc:
                      last = {'request_error': str(exc)}
                  if i + 1 < attempts: time.sleep(pause)
              raise AssertionError(f'{path}: contract not ready after {attempts} attempts: {last}')

          health = req('/api/health')
          assert health.get('ok') is True, health
          assert health.get('engine_version') == '0.5.0-zpzq-fusion', health
          assert health.get('checks', {}).get('rule_db') is True, health
          assert health.get('checks', {}).get('astronomy') is True, health
          assert health.get('checks', {}).get('events') == 12, health

          status = req('/api/tinh-trang')
          assert status.get('so_loai_viec_v1') == 12, status
          assert status.get('numeric_score') == 'LOCKED_OFF', status

          v1_today = req('/api/stateless/hom-nay', {'profile': profile, 'ngay': '2026-08-24'})
          assert v1_today.get('ngay') == '2026-08-24', v1_today
          assert v1_today.get('gio_status') == 'STRUCTURAL_ONLY_PERSONAL_USE_PENDING', v1_today

          v1_search = req('/api/stateless/tim-ngay', {'profile': profile, 'viec': 'KY_HOP_DONG', 'tu_ngay': '2026-08-24', 'den_ngay': '2026-08-31'})
          assert v1_search.get('so_ngay_da_quet') == 8, v1_search
          assert v1_search.get('xep_hang_status') == 'ORDINAL_V1_1_PERSONAL', v1_search
          assert all(x.get('score') is None for x in v1_search.get('cac_ngay', [])), v1_search

          if event_name != 'pull_request':
              schema = wait_for_contract(
                  '/api/v2/schema-status',
                  lambda x: (
                      x.get('schema_version') == '2.5-alpha.1'
                      and x.get('product_schema_version') == '2.5-alpha.1'
                      and (x.get('confidence_model') or {}).get('version') == '2.8-alpha.1'
                      and (x.get('hour_fusion_v29') or {}).get('policy_version') == '2.9-alpha.1'
                  ),
              )
              assert schema.get('status') == 'V2_5_HIEP_KY_PARTIAL_ACTIVE', schema
              assert schema.get('numeric_score') == 'LOCKED_OFF', schema
              hk = schema.get('hiep_ky_v25', {})
              assert hk.get('coverage') == 'V2_5_PARTIAL_12_TRUC_PLUS_MONTH_BRANCH_5', hk
              assert hk.get('decision_hierarchy') == 'HARD_BLOCK > EVENT > PERSONAL', hk
              assert hk.get('full_classical_claim') is False, hk
              confidence_model = schema.get('confidence_model', {})
              assert confidence_model.get('version') == '2.8-alpha.1', confidence_model
              assert confidence_model.get('provisional_cap') == 'Căn cứ vừa', confidence_model
              assert confidence_model.get('numeric_score') is None, confidence_model
              hour_cap = schema.get('hour_fusion_v29', {})
              assert hour_cap.get('policy_version') == '2.9-alpha.1', hour_cap
              assert hour_cap.get('status') == 'V2_9A_EVENT_DAY_GATED_HOUR_REFERENCE', hour_cap
              assert hour_cap.get('event_day_gate_ready') is True, hour_cap
              assert hour_cap.get('verified_hour_rule_decision_ready') is False, hour_cap
              assert hour_cap.get('hard_block_can_be_rescued_by_hour') is False, hour_cap
              assert hour_cap.get('numeric_score') is None, hour_cap

              today = req('/api/v2/hom-nay', {'profile': profile, 'ngay': '2026-08-24'})
              assert today.get('schema_version') == '2.5-alpha.1', today
              assert today.get('product_schema_version') == '2.5-alpha.1', today
              assert today.get('component_schema_version') == '2.3-alpha.1', today
              assert today.get('numeric_score') is None, today
              assert today.get('confidence_model_version') == '2.8-alpha.1', today
              assert isinstance(today.get('confidence_basis'), list) and today['confidence_basis'], today

              work = req('/api/v2/cong-viec', {'profile': profile, 'scope': 'day', 'ngay': '2026-08-24'})
              assert work.get('schema_version') == '2.5-alpha.1', work
              assert work.get('product_schema_version') == '2.5-alpha.1', work
              assert work.get('component_schema_version') == '2.3-alpha.1', work
              assert work.get('confidence_model_version') == '2.8-alpha.1', work
              assert isinstance(work.get('confidence_basis'), list) and work['confidence_basis'], work

              hours = req('/api/v2/gio-ca-nhan', {'profile': profile, 'ngay': '2026-08-24'})
              assert hours.get('schema_version') == '2.5-alpha.1', hours
              assert hours.get('product_schema_version') == '2.5-alpha.1', hours
              assert hours.get('component_schema_version') == '2.4-alpha.1', hours
              assert hours.get('kind') == 'personal_hour_fusion', hours
              assert hours.get('hour_fusion_policy_version') == '2.9-alpha.1', hours
              assert hours.get('conclusion', {}).get('state') == 'DESCRIPTIVE_ONLY', hours
              assert hours.get('conclusion', {}).get('label') == 'Thiếu bối cảnh việc', hours
              assert hours.get('event_day_context_present') is False, hours
              assert hours.get('hour_fusion_ready') is False, hours
              assert hours.get('personal_hour_decision_ready') is False, hours
              assert hours.get('numeric_score') is None, hours
              assert hours.get('confidence_state') == 'Chưa đủ căn cứ', hours
              assert hours.get('confidence_model_version') == '2.8-alpha.1', hours
              assert len(hours.get('hours', [])) == 12, hours
              assert all(x.get('decision_state') == 'DESCRIPTIVE_ONLY' for x in hours['hours']), hours
              assert all(x.get('is_personal_good_hour') is None for x in hours['hours']), hours
              assert all(x.get('is_personal_bad_hour') is None for x in hours['hours']), hours

              v27 = req('/api/v2/tim-ngay', {'profile': profile, 'viec': 'KY_HOP_DONG', 'tu_ngay': '2026-08-24', 'den_ngay': '2026-08-31'})
              assert v27.get('schema_version') == '2.5-alpha.1', v27
              assert v27.get('product_schema_version') == '2.5-alpha.1', v27
              assert v27.get('status') == 'V2_5_HIEP_KY_PARTIAL_ACTIVE', v27
              assert v27.get('ranking_mode') == 'ORDINAL_V25_HARD_BLOCK_EVENT_PERSONAL', v27
              assert v27.get('event_search_contract') == 'V2_7_COMPLETE_RESULTS', v27
              assert v27.get('confidence_model_version') == '2.8-alpha.1', v27
              assert v27.get('numeric_score') is None, v27
              assert v27.get('result_count') == 8, v27
              assert v27.get('top_result_count') == 3, v27
              assert len(v27.get('results', [])) == 3, v27
              assert len(v27.get('all_results', [])) == 8, v27
              allowed = {'Căn cứ rõ', 'Căn cứ vừa', 'Chưa đủ căn cứ'}
              assert all(x.get('confidence_model_version') == '2.8-alpha.1' for x in v27['all_results']), v27
              assert all(x.get('confidence_state') in allowed for x in v27['all_results']), v27
              assert all(isinstance(x.get('confidence_basis'), list) and x['confidence_basis'] for x in v27['all_results']), v27
              assert all(x.get('numeric_score') is None for x in v27['all_results']), v27
              assert [x.get('date') for x in v27['results']] == [x.get('date') for x in v27['all_results'][:3]], v27

              provisional = req('/api/v2/tim-ngay', {'profile': profile, 'viec': 'MUA_TAI_SAN', 'tu_ngay': '2026-08-24', 'den_ngay': '2026-08-31'})
              assert provisional.get('result_count') == 8, provisional
              assert all(x.get('confidence_state') != 'Căn cứ rõ' for x in provisional.get('all_results', [])), provisional
              assert any(any('PROVISIONAL' in b for b in x.get('confidence_basis', [])) for x in provisional.get('all_results', [])), provisional

              hour_days = req('/api/v2/tim-ngay', {
                  'profile': profile, 'viec': 'KY_HOP_DONG',
                  'tu_ngay': '2026-08-24', 'den_ngay': '2026-11-24'
              })
              rows = hour_days.get('all_results', [])
              blocked = next((x for x in rows if (x.get('event_context') or {}).get('hard_block') is True), None)
              eligible = next((x for x in rows if (x.get('event_context') or {}).get('hard_block') is not True), None)
              assert blocked is not None, 'V2.9A smoke needs at least one HARD_BLOCK day in max window'
              assert eligible is not None, 'V2.9A smoke needs at least one non-blocked day in max window'

              blocked_hours = req('/api/v2/gio-ca-nhan', {
                  'profile': profile, 'ngay': blocked.get('date'), 'viec': 'KY_HOP_DONG'
              })
              assert blocked_hours.get('kind') == 'personal_hour_fusion', blocked_hours
              assert blocked_hours.get('hour_fusion_policy_version') == '2.9-alpha.1', blocked_hours
              assert blocked_hours.get('event_code') == 'KY_HOP_DONG', blocked_hours
              assert blocked_hours.get('event_day_context_present') is True, blocked_hours
              assert blocked_hours.get('conclusion', {}).get('state') == 'BLOCKED_BY_DAY', blocked_hours
              assert blocked_hours.get('personal_hour_decision_ready') is False, blocked_hours
              assert blocked_hours.get('numeric_score') is None, blocked_hours
              assert len(blocked_hours.get('hours', [])) == 12, blocked_hours
              assert all(x.get('decision_state') == 'INELIGIBLE_BY_DAY' for x in blocked_hours['hours']), blocked_hours
              assert all(x.get('day_gate') == 'HARD_BLOCK' for x in blocked_hours['hours']), blocked_hours
              assert all(x.get('is_personal_good_hour') is None for x in blocked_hours['hours']), blocked_hours
              assert all(x.get('is_personal_bad_hour') is None for x in blocked_hours['hours']), blocked_hours

              eligible_hours = req('/api/v2/gio-ca-nhan', {
                  'profile': profile, 'ngay': eligible.get('date'), 'viec': 'KY_HOP_DONG'
              })
              assert eligible_hours.get('kind') == 'personal_hour_fusion', eligible_hours
              assert eligible_hours.get('hour_fusion_policy_version') == '2.9-alpha.1', eligible_hours
              assert eligible_hours.get('event_day_context_present') is True, eligible_hours
              assert eligible_hours.get('conclusion', {}).get('state') == 'DESCRIPTIVE_ONLY', eligible_hours
              assert eligible_hours.get('hour_fusion_ready') is True, eligible_hours
              assert eligible_hours.get('personal_hour_decision_ready') is False, eligible_hours
              assert eligible_hours.get('confidence_state') == 'Chưa đủ căn cứ', eligible_hours
              assert len(eligible_hours.get('hours', [])) == 12, eligible_hours
              assert all(x.get('decision_state') == 'DESCRIPTIVE_ONLY' for x in eligible_hours['hours']), eligible_hours
              assert all(x.get('day_gate') == 'PASS_TO_HOUR_RULES' for x in eligible_hours['hours']), eligible_hours
              assert all(x.get('is_personal_good_hour') is None for x in eligible_hours['hours']), eligible_hours
              assert all(x.get('is_personal_bad_hour') is None for x in eligible_hours['hours']), eligible_hours

          print('LIVE_SMOKE_PRODUCTION = PASS')
          PY
