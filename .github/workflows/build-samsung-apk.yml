name: Build Samsung APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-20260908
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-samsung-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify web payload
        shell: bash
        run: |
          sha256sum html.v2.part*.b64
          echo '052c4427c5fd3797c7512de19d8c81a64b83216d2f02600513536e79a1a96f10  html.v2.part1.b64' | sha256sum -c -
          echo '835d376fb88ee83be86c5ebfd8dc8de3656410be890fb6d1dff3e265c6d6971b  html.v2.part2.b64' | sha256sum -c -
          echo 'd17bd012b722922262494cf3e4cd3e57d3f9236063fe6924f43a159fa91067bc  html.v2.part3.b64' | sha256sum -c -
          echo '489d9be00cb7906e0cd81b1b1f7b0195ed65e8ed1b139647f521bb649a7e2882  html.v2.part4.b64' | sha256sum -c -

      - name: Rebuild web app asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat html.v2.part1.b64 html.v2.part2.b64 html.v2.part3.b64 html.v2.part4.b64 | base64 -d | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q '<!DOCTYPE html>' app/src/main/assets/index.html
          grep -q 'Theo sách / vì sao app kết luận vậy?' app/src/main/assets/index.html
          grep -q 'Nên làm' app/src/main/assets/index.html
          grep -q 'Nên tránh' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ../So-tay-Tu-Binh-Samsung.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: So-tay-Tu-Binh-Samsung
          path: So-tay-Tu-Binh-Samsung.apk
          if-no-files-found: error
          retention-days: 7
