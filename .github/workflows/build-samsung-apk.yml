name: Build Samsung APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-20260908
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-samsung-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild web app asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat html.part1.b64 html.part2.b64 html.part3.b64 | base64 -d | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q '<!DOCTYPE html>' app/src/main/assets/index.html
          grep -q 'Theo sách / vì sao app kết luận vậy?' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ../So-tay-Tu-Binh-Samsung.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: So-tay-Tu-Binh-Samsung
          path: So-tay-Tu-Binh-Samsung.apk
          if-no-files-found: error
          retention-days: 7
