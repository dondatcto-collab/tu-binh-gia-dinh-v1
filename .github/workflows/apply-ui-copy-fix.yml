name: Apply final UI copy fixes

on:
  push:
    branches:
      - finalize-0.5.0-docs-smoke

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize-0.5.0-docs-smoke
      - name: Update mirrored UI files
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [Path('public/static/app.js'), Path('giao_dien/app.js')]
          replacements = [
              ("const APP_VERSION='0.4.0';", "const APP_VERSION='0.5.0';"),
              ("0.4 · đúng phương pháp", "Theo phương pháp đã khóa"),
              ("cycle.textContent=`Đại vận ${pos.dai_van?.tru||'—'} · ${pos.nam_hien_tai?.vi||'—'} · ${pos.thang_hien_tai?.vi||'—'}`;",
               "cycle.textContent=`Đại vận ${pos.dai_van?.tru||'—'} · Năm ${pos.nam_hien_tai?.vi||'—'} · Tháng ${pos.thang_hien_tai?.vi||'—'}`;"),
              ("<b>${esc(dg.headline||s.tom_tat)}</b>", "<b>${esc(s.tom_tat||dg.headline||'Chưa có tín hiệu nổi bật')}</b>"),
              ("<p><b>Cấu trúc:</b> ${esc(dg.cong_viec||s.vi_sao||'Đang đọc cấu trúc')}</p>",
               "<p><b>Xu hướng:</b> ${esc(s.tom_tat||'Chưa có tín hiệu nổi bật')}</p>"),
              ("<p><i class=\"neutral-dot\"></i><b>Công việc:</b> ${esc(dg.cong_viec||'Đang đọc cấu trúc')}</p>",
               "<p><i class=\"neutral-dot\"></i><b>Xu hướng chung:</b> ${esc(s.tom_tat||'Chưa có tín hiệu nổi bật')}</p>"),
              ("if(/Không ưu tiên|JI|CAN_NHAC|xung động/i.test(x))return /Không ưu tiên|JI/i.test(x)?'bad':'warn';if(/Ưu tiên|Phù hợp|THUAN|Khá thuận/i.test(x))return 'good';",
               "if(/Không ưu tiên|JI|CAN_NHAC|xung động|Cần thận trọng|Cân nhắc|CAUTION/i.test(x))return /Không ưu tiên|JI/i.test(x)?'bad':'warn';if(/Ưu tiên|Phù hợp|THUAN|Khá thuận|Thuận nền mệnh|SUPPORT/i.test(x))return 'good';"),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              before = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:80]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}: {len(before)} -> {len(text)} bytes')

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Mirrored app.js files are no longer identical')
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ui-copy-fix.yml
          git add public/static/app.js giao_dien/app.js
          git commit -m "ui: align 0.5.0 copy and calendar tones"
          git push origin HEAD:finalize-0.5.0-docs-smoke
