name: Apply final 0.5.0 status tones

on:
  push:
    branches:
      - ui-tone-0.5.0-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-tone-0.5.0-final
      - name: Update mirrored UI files
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('public/static/app.js'),Path('giao_dien/app.js')]
          old="function badgeClass(label=''){if(/Không ưu tiên|JI/i.test(label))return'bad';if(/Phù hợp theo Hiệp Kỷ|^Phù hợp$/i.test(label))return'good';if(/Có thể cân nhắc|Cân nhắc|lưu ý/i.test(label))return'warn';return'neutral'}"
          new="function badgeClass(label=''){if(/Bị chặn|Không ưu tiên|JI|HARD_BLOCK/i.test(label))return'bad';if(/Ưu tiên|Phù hợp|Thuận nền mệnh|SUPPORT/i.test(label))return'good';if(/Có thể cân nhắc|Cân nhắc|Cần thận trọng|CAUTION|lưu ý/i.test(label))return'warn';return'neutral'}"
          old2='<div class="ordinal-disc"><span>V1</span><b>BASIC</b></div>'
          new2='<div class="ordinal-disc"><span>V1</span><b>0.5</b></div>'
          for path in paths:
              text=path.read_text(encoding='utf-8')
              if text.count(old)!=1: raise SystemExit(f'badgeClass unexpected in {path}: {text.count(old)}')
              if text.count(old2)!=1: raise SystemExit(f'ordinal-disc unexpected in {path}: {text.count(old2)}')
              text=text.replace(old,new).replace(old2,new2)
              path.write_text(text,encoding='utf-8')
          if paths[0].read_bytes()!=paths[1].read_bytes(): raise SystemExit('app.js mirrors differ')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ui-tone-final.yml
          git add public/static/app.js giao_dien/app.js
          git commit -m "ui: align final 0.5.0 status colors"
          git push origin HEAD:ui-tone-0.5.0-final
