name: Build Tu Binh Dat Vo APK v1.2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify locked v1.2 sources
        working-directory: android-apk
        run: |
          python - <<'PY'
          import base64, gzip, glob, hashlib, pathlib
          parts = sorted(glob.glob('htmlparts/part[0-9][0-9].txt'))
          assert len(parts) == 10, parts
          raw = ''.join(open(p, encoding='ascii').read() for p in parts)
          html_bytes = gzip.decompress(base64.b64decode(raw))
          html = html_bytes.decode('utf-8')
          sha = hashlib.sha256(html_bytes).hexdigest()
          expected = '1f9a4769570fc29ecb0c526ed3cec01ae99f5c5631560a9f36f09da67871934f'
          assert sha == expected, (sha, expected)
          assert '<html' in html.lower() and '</html>' in html.lower()
          assert 'Tử Bình Đạt Võ' in html
          assert 'Ngày này nên làm gì' in html
          assert 'Theo sách' in html
          assert 'data:image/png;base64,' in html
          print('HTML bytes:', len(html_bytes))
          print('HTML SHA256:', sha)
          PY
          grep -q "versionCode 3" app/build.gradle
          grep -q "versionName '1.2.0'" app/build.gradle
          grep -q "@drawable/app_icon_art" app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/app_icon_art.webp
          ! grep -q "personalizeHtml" app/src/main/java/vn/tubinh/sotay/MainActivity.java
          grep -q "loadDataWithBaseURL.*loadHtml()" app/src/main/java/vn/tubinh/sotay/MainActivity.java

      - name: Prepare embedded HTML
        working-directory: android-apk
        run: |
          mkdir -p app/src/main/assets/htmlparts
          cp htmlparts/part*.txt app/src/main/assets/htmlparts/
          test $(ls app/src/main/assets/htmlparts/part*.txt | wc -l) -eq 10

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Tu-Binh-Dat-Vo-Samsung-v1.2.apk

      - name: Verify APK
        run: |
          test -s Tu-Binh-Dat-Vo-Samsung-v1.2.apk
          unzip -l Tu-Binh-Dat-Vo-Samsung-v1.2.apk | grep -q 'assets/htmlparts/part09.txt'
          sha256sum Tu-Binh-Dat-Vo-Samsung-v1.2.apk
          ls -lh Tu-Binh-Dat-Vo-Samsung-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tu-Binh-Dat-Vo-Samsung-v1.2-APK
          path: Tu-Binh-Dat-Vo-Samsung-v1.2.apk
          if-no-files-found: error
          retention-days: 14
