name: Build Tu Binh Dat Vo APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare final branded HTML
        working-directory: android-apk
        run: |
          python3 build_final_html_wrapper.py
          test $(ls app/src/main/assets/htmlparts/part*.txt | wc -l) -eq 10
          test -f app/src/main/res/drawable/app_icon.xml

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Tu-Binh-Dat-Vo-Samsung.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tu-Binh-Dat-Vo-Samsung-APK
          path: Tu-Binh-Dat-Vo-Samsung.apk
          if-no-files-found: error
          retention-days: 14
