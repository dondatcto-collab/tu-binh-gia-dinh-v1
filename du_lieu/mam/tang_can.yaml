# Không được dùng để suy ra bất cứ điều gì, không được đưa vào tính toán.
gia_thuyet_thu_tu:
  status: HYPOTHESIS
  source_id: null
  canh_bao: "Chưa có nguồn. Ghi lại để người duyệt biết tôi đang nghĩ gì, không hơn."
  cac_gia_thuyet:
    - ma: GT-01
      noi_dung: "Uyên Hải Tử Bình có thể xếp theo trình tự khí lên ngôi trong tháng."
      bang_chung: "KHÔNG CÓ. Bài phú không nói gì về trình tự thời gian."
    - ma: GT-02
      noi_dung: "Bảng đời sau có thể xếp Can mạnh nhất lên trước."
      bang_chung: "KHÔNG CÓ. Bảng đó không tự nói mình xếp theo tiêu chí nào."
