- source_id: SRC-VSOP87-AE
  independence_group: ASTRONOMICAL_EPHEMERIS
  title: astronomy-engine — cài đặt VSOP87 cho vị trí biểu kiến Mặt Trời
  author: Don Cross
  dynasty_or_year: 2019 tới nay
  edition: bản Python trên PyPI
  language: en
  source_type: DATASET
  url_or_file_reference: https://github.com/cosinekitty/astronomy
  primary_or_secondary: PRIMARY
  edition_certainty: NOT_APPLICABLE
  status: ACTIVE
  notes: 'Dùng để tính thời điểm 24 tiết khí. Đối chiếu với pymeeus lệch 3,6 giây ở Lập Xuân 1990, và với sxtwl lệch dưới
    3 giây. Giấy phép MIT.

    '
- source_id: SRC-MEEUS
  independence_group: ASTRONOMICAL_EPHEMERIS
  title: pymeeus — cài đặt thuật toán thiên văn của Jean Meeus
