passages:
- passage_id: PSG-UHTB-NGUHO
  source_id: SRC-UHTB-CHEP
  chapter: Ngũ Hổ Độn niên khởi nguyệt (五虎遁)
  original_text: '甲己之年丙作首

    乙庚之歲戊為頭

    丙辛之歲尋庚上

    丁壬壬位順行流

    戊癸何方發

    甲寅之上好追求

    '
  translation_vi: 'Năm Giáp hoặc Kỷ thì Bính làm đầu.

    Năm Ất hoặc Canh thì Mậu làm đầu.

    Năm Bính hoặc Tân thì tìm lên Canh.

    Năm Đinh hoặc Nhâm thì từ ngôi Nhâm thuận dòng.

    Năm Mậu hoặc Quý khởi từ đâu, hãy tìm ở Giáp Dần.

    '
  derivation_note: 'Sáu câu phú cho NĂM nhóm tương đương, không phải mười quy tắc rời. Mỗi câu ấn định Can của tháng Dần.
    Các tháng sau đi thuận theo lục thập hoa giáp.

    '
- passage_id: PSG-UHTB-NGUTHU
  source_id: SRC-UHTB-CHEP
  chapter: Ngũ Thử Độn nhật khởi thời (五鼠遁)
  original_text: '甲己還加甲

    乙庚丙作初

    丙辛從戊起

    丁壬庚子居

    戊癸何方發

    壬子是真途

    '
  translation_vi: 'Ngày Giáp hoặc Kỷ thì lại thêm Giáp.

    Ngày Ất hoặc Canh thì Bính làm khởi đầu.

    Ngày Bính hoặc Tân thì khởi từ Mậu.

    Ngày Đinh hoặc Nhâm thì ở Canh Tý.

    Ngày Mậu hoặc Quý khởi từ đâu, Nhâm Tý là đường thật.

    '
  derivation_note: 'Bài phú trả lời: KHI ĐÃ BIẾT Can ngày dùng để khởi giờ, thì Can giờ Tý bắt đầu từ đâu. Nó KHÔNG trả lời
    câu hỏi chọn Can ngày nào ở khoảng trước nửa đêm — đó là TIME-0007, một vấn đề khác.

    '
- passage_id: PSG-UHTB-DAIVAN
  source_id: SRC-UHTB-CHEP
  chapter: Luận khởi Đại vận pháp (論起大運法)
  original_text: '陽男陰女順行

    陽女陰男逆行

    三日為一歲

    '
  translation_vi: 'Dương nam, Âm nữ đi thuận.

    Dương nữ, Âm nam đi nghịch.

    Ba ngày ứng một tuổi.

    '
  derivation_note: 'Văn bản xác lập BA điều: chiều thuận nghịch, đếm tới Tiết (thuận đếm tới Tiết kế, nghịch đếm về Tiết đã
    qua), và tỷ lệ ba ngày một tuổi. Văn bản KHÔNG nói cách quy đổi phần dư giờ phút thành tháng ngày giao vận.

    '
- passage_id: PSG-UHTB-GIAOTIET
  source_id: SRC-UHTB-CHEP
  chapter: Luận khởi Đại vận pháp — phần giao Tiết
  original_text: 交節
  translation_vi: Giao Tiết.
  derivation_note: 'Phần khởi Đại vận dùng trực tiếp các Tiết như Lập Xuân, Kinh Trập, và nêu người sinh trước hoặc sau lúc
    giao Tiết có thể thuộc tháng trước hoặc tháng sau. Đây là bằng chứng gián tiếp rằng tháng lịch pháp mở tại Tiết. Nó KHÔNG
    phải một phát biểu trọn vẹn về thuật toán chia tháng.

    '
- passage_id: PSG-XUANTHU-KYTI
  source_id: SRC-XUANTHU-NHATTHUC
  chapter: Xuân Thu, Lỗ Ẩn Công năm thứ ba, tháng hai
  original_text: 三年春，王二月己巳，日有食之
  translation_vi: Năm thứ ba, mùa xuân, tháng hai nhà Chu, ngày Kỷ Tị, mặt trời bị ăn.
  derivation_note: 'Ghi chép này gắn một CAN CHI NGÀY với một HIỆN TƯỢNG THIÊN VĂN. Nhờ đó nó neo được chu kỳ 60 vào trục
    thời gian tuyệt đối, việc mà một mình tính tuần hoàn không làm được.

    '
- passage_id: PSG-TMTH-DAIVAN
  source_id: SRC-TMTH-CHEP
  chapter: Tam Mệnh Thông Hội, quyển hai, Luận Đại vận
  original_text: '陽男陰女，大運以生日後未來節氣日時為數，順而行之。

    陰男陽女，大運以生日前過去節氣日時為數，逆而行之。

    總十年之運氣，凡三日有三十六時，乃見三百六十日，為一歲之數。

    實歷過六十三日，折除過六十三時，折除計六百三十日，乃一歲奇九月之大運。

    '
  translation_vi: 'Dương nam Âm nữ, Đại vận đếm theo ngày giờ tới Tiết sắp đến sau ngày sinh, đi thuận.

    Âm nam Dương nữ, đếm theo ngày giờ tới Tiết đã qua trước ngày sinh, đi nghịch.

    Gộp vận mười năm, ba ngày có ba mươi sáu thời, thành ba trăm sáu mươi ngày là số của một tuổi.

    Thực lịch quá sáu mươi ba ngày, chiết trừ quá sáu mươi ba thời, chiết trừ kế sáu trăm ba mươi ngày, ấy là Đại vận một
    tuổi lẻ chín tháng.

    '
  derivation_note: "Đây là phần chi tiết mà Uyên Hải Tử Bình KHÔNG nói. Giải ví dụ: 5 ngày 3 thời thần tới Lập Xuân.\n  3\
    \ ngày = 1 tuổi;  1 ngày = 4 tháng;  1 thời thần = 10 ngày.\n  5 ngày -> 1 tuổi dư 2 ngày -> 8 tháng; 3 thời -> 30 ngày\
    \ -> 1 tháng.\n  Cộng lại: 1 tuổi 9 tháng. Khớp nguyên văn.\nKiểm con số 630: (5 + 3/12) chia 3 rồi nhân 360 = đúng 630\
    \ ngày. => Cổ thư chiết trừ theo NĂM 360 NGÀY, không phải năm 365,2422 ngày.\n"
- passage_id: PSG-UHTB-TANGCAN
  source_id: SRC-UHTB-CHEP
  chapter: Hựu Địa Chi tàng độn ca (又地支藏遁歌)
  original_text: '子宮癸水在其中，丑癸辛金己土同；

    寅宮甲木兼丙戊，卯宮乙木獨相逢。

    辰藏乙戊三分癸，巳中庚金丙戊叢；

    午宮丁火并己土，未宮乙己丁共宗。

    申位庚金壬水戊，酉宮辛金獨豐隆；

    戌宮辛金及丁戊，亥藏壬甲是真蹤。

    '
  translation_vi: 'Cung Tý có Quý thủy ở trong, Sửu có Quý, Tân kim, Kỷ thổ cùng;

    Cung Dần có Giáp mộc kèm Bính Mậu, cung Mão chỉ gặp riêng Ất mộc.

    Thìn tàng Ất Mậu, ba phần Quý; trong Tị có Canh kim, Bính Mậu tụ;

    Cung Ngọ có Đinh hỏa cùng Kỷ thổ, cung Mùi có Ất Kỷ Đinh chung gốc.

    Ngôi Thân có Canh kim Nhâm thủy Mậu, cung Dậu chỉ riêng Tân kim đầy đặn;

    Cung Tuất có Tân kim và Đinh Mậu, Hợi tàng Nhâm Giáp là dấu thật.

    '
  derivation_note: 'Bài phú cho TẬP CAN của 12 Chi và MỘT THỨ TỰ liệt kê. Nó KHÔNG nói Can nào mạnh yếu, không nói tỷ lệ,
    không gọi tên bản khí trung khí dư khí. Mọi điều đó nằm ngoài văn bản này. Riêng câu Thìn có chữ "三分". Chưa rõ nghĩa,
    không quy thành tỷ lệ.

    '
- passage_id: PSG-TMTH-NHANNGUYEN
  source_id: SRC-TMTH-CHEP
  chapter: Tam Mệnh Thông Hội, quyển hai, Luận Nhân Nguyên Ty Sự (論人元司事)
  original_text: 故支中所藏者主命，謂之人元，名為司事之神，以命術言之為月令。
  translation_vi: 'Cho nên cái tàng trong Chi thì chủ về mệnh, gọi là Nhân Nguyên, đặt tên là thần ty sự, xét theo mệnh thuật
    thì là nguyệt lệnh.

    '
  derivation_note: 'PHẠM VI: đoạn này nói về NHÂN NGUYÊN TY SỰ, tức Can nào ĐƯƠNG QUYỀN trong từng đoạn nguyệt lệnh. Đó là
    SEASONAL_GOVERNING_QI. Nó KHÔNG phải phát biểu về TẬP Tàng Can tĩnh (STATIC_HIDDEN_STEM_SET). Hai khái niệm có liên quan
    nhưng KHÔNG được đồng nhất. Vì vậy đoạn này KHÔNG được dùng làm nguồn xác nhận BT-HIDDEN-*. Nó dành cho nhóm BT-SEASON-POWER,
    chưa làm.

    Nội dung đáng chú ý: chính sách này, ở phần sau, mượn lời Túy Tỉnh Tử để nghi ngờ thuyết nhân nguyên ty sự. Người biên
    chú bản in hiện đại ghi "cổ đại thuật sĩ đối thử thuyết pháp tịnh bất tương đồng" và "tàng can chi thâm thiển thượng vô
    nhất định chi tiêu chuẩn". => Ngay ở nhóm BT-SEASON-POWER sau này, nhiều khả năng phải để CONFLICTED.

    '
- passage_id: PSG-UHTB-THAPTHAN
  source_id: SRC-UHTB-CHEP
  chapter: Uyên Hải Tử Bình, quyển một — đoạn năm loại quan hệ
  original_text: '一曰官，分之陰陽，曰官、曰殺，甲乙見庚辛也。

    甲見庚為殺，陽見陽也。見辛為官，陽見陰也。乙木庚為官，見辛為殺。

    二曰財，分之陰陽，曰正財、偏財，甲乙見戊己是也。陽見陰為正財，陰見陰為偏財。

    三曰生氣之陰陽，曰印綬、曰倒食，甲乙見壬癸是也。

    甲見癸，乙見壬為印綬；甲見壬，乙見癸為偏印。

    四曰竊氣之陰陽，曰食神、曰傷官，甲乙見丙丁是也。

    甲見丙為食神、見丁為傷官，乙見丁為食神、見丙為傷官。

    五曰同類之陰陽，曰劫財、曰羊刃，甲乙見甲乙是也。陽見陽為羊刃，陰見陽為劫財。

    '
  translation_vi: 'Một là Quan, chia theo âm dương thành Quan và Sát, là Giáp Ất gặp Canh Tân.

    Giáp gặp Canh là Sát, dương gặp dương. Gặp Tân là Quan, dương gặp âm.

    Ất mộc gặp Canh là Quan, gặp Tân là Sát.

    Hai là Tài, chia thành Chính Tài và Thiên Tài, là Giáp Ất gặp Mậu Kỷ.

    Dương gặp âm là Chính Tài, âm gặp âm là Thiên Tài.

    Ba là khí sinh, chia thành Ấn Thụ và Đảo Thực, là Giáp Ất gặp Nhâm Quý.

    Giáp gặp Quý, Ất gặp Nhâm là Ấn Thụ; Giáp gặp Nhâm, Ất gặp Quý là Thiên Ấn.

    Bốn là khí tiết ra, chia thành Thực Thần và Thương Quan, là Giáp Ất gặp Bính Đinh.

    Giáp gặp Bính là Thực Thần, gặp Đinh là Thương Quan;

    Ất gặp Đinh là Thực Thần, gặp Bính là Thương Quan.

    Năm là đồng loại, chia thành Kiếp Tài và Dương Nhận, là Giáp Ất gặp Giáp Ất.

    Dương gặp dương là Dương Nhận, âm gặp dương là Kiếp Tài.

    '
  derivation_note: 'Đoạn này định nghĩa NĂM CHIỀU QUAN HỆ và quy ước chia theo âm dương. Nó cho đủ căn cứ cho tám trên mười
    ô, qua các ví dụ nói thẳng. RIÊNG cặp đồng loại, sách gọi là "Kiếp Tài và Dương Nhận", KHÔNG phải "Tỷ Kiên và Kiếp Tài"
    như quy ước hiện đại. Xem BT-TG-CONFLICT-001.

    '
- passage_id: PSG-ZPZQ-STRENGTH
  source_id: SRC-ZPZQ-NLC-SCAN
  chapter: 六、論十干得時不旺失時不弱
  original_text: 況八字雖以月令爲重，而旺相休囚，年月日時，亦有損益之權。
  translation_vi: Bát Tự tuy lấy nguyệt lệnh làm trọng, nhưng trạng thái vượng–tướng–hưu–tù còn chịu sự tăng giảm của năm,
    tháng, ngày và giờ.
  derivation_note: 'Khóa nguyên tắc: không được đồng nhất “đắc lệnh = chắc chắn thân vượng” hoặc “thất lệnh = chắc chắn thân
    nhược”. Đánh giá mạnh yếu phải nhìn toàn Tứ Trụ và căn khí, nhưng đây chưa phải công thức chấm trọng số.'
- passage_id: PSG-ZPZQ-USE-MONTH
  source_id: SRC-ZPZQ-NLC-SCAN
  chapter: 八、論用神
  original_text: 八字用神，專求月令，以日干配月令地支，而生尅不同，格局分焉。
  translation_vi: Dụng thần của Bát Tự chuyên tìm ở nguyệt lệnh; lấy Nhật can phối với Địa chi tháng, theo sinh khắc khác
    nhau mà phân thành cách cục.
  derivation_note: Trong Tử Bình Chân Thuyên, “Dụng thần” trước hết là dụng thần/cách cục từ nguyệt lệnh, không được tự động
    đồng nhất với “ngũ hành cân bằng thân mạnh-yếu” của các hệ đời sau.
- passage_id: PSG-ZPZQ-TRANSIT
  source_id: SRC-ZPZQ-NLC-SCAN
  chapter: 二十五、論行運
  original_text: 論運與看命，無二法也。看命以四柱干支，配月令之喜忌；而取運則又以運之干支，配八字之喜忌。
  translation_vi: 'Luận vận và xem mệnh không phải hai phép khác nhau: xem mệnh lấy Can Chi Tứ Trụ phối với hỷ kỵ của nguyệt
    lệnh; xét vận lại lấy Can Chi của vận phối với hỷ kỵ của Bát Tự.'
  derivation_note: 'Khóa đường hợp lưu: phải xác lập cấu trúc/hỷ kỵ từ mệnh gốc trước, rồi mới cho Đại vận/Năm/Tháng/Ngày/Giờ
    tác động vào. Không lấy Thập Thần hay một quan hệ Chi của thời điểm thay cho hỷ kỵ mệnh gốc.'
