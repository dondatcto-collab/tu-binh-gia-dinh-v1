- source_id: SRC-UHTB-CHEP
  independence_group: CLASSICAL_TEXT
  title: 淵海子平 — Uyên Hải Tử Bình (bản chép số hóa)
  author: Từ Đại Thăng (Từ Tử Bình) — truyền thống quy cho
  dynasty_or_year: Tống, biên tập lại đời Minh
  edition: CHƯA KHÓA ĐƯỢC BẢN IN CỤ THỂ
  language: zh-Hant
  source_type: CLASSICAL_TEXT_TRANSCRIPTION
  url_or_file_reference: null
  primary_or_secondary: PRIMARY
  edition_certainty: TRANSCRIPTION_ONLY
  provenance_note: 'Nguyên văn do người duyệt cung cấp trong phiên làm việc ngày 2026-08-21. TÔI KHÔNG TỰ KIỂM CHỨNG ĐƯỢC
    văn bản này với một bản in hay bản chụp nào, vì môi trường chạy không ra được internet mở. Đây là bản chép, KHÔNG phải
    bản chụp nguyên bản. Chưa khóa được quyển, chương, trang.

    '
  status: ACTIVE
  notes: 'Dùng cho ba bài phú: Ngũ Hổ Độn, Ngũ Thử Độn, và phần Luận khởi Đại vận pháp. Khi nào có bản in cụ thể thì đổi edition_certainty
    và ghi số trang.

    '
- source_id: SRC-XUANTHU-NHATTHUC
  independence_group: CLASSICAL_TEXT
  title: '春秋 — Xuân Thu, Lỗ Ẩn Công năm thứ ba: 己巳，日有食之'
  author: truyền thống quy cho Khổng Tử san định
  dynasty_or_year: khoảng thế kỷ 5 trước Công nguyên
  edition: CHƯA KHÓA ĐƯỢC BẢN IN CỤ THỂ
  language: zh-Hant
  source_type: CLASSICAL_TEXT_TRANSCRIPTION
  url_or_file_reference: https://www.shidianguji.com/zh/book/CADAL02075120/chapter/1lajdrsjfur61
  primary_or_secondary: PRIMARY
  edition_certainty: TRANSCRIPTION_ONLY
  provenance_note: 'Nguyên văn lấy từ 春秋日食集證 quyển một (Phùng Trừng, Nam Thông Châu), bản số hóa trên Thức Điển Cổ Tịch. Sách
    này chép lại kinh văn kèm lời bàn của Công Dương, Cốc Lương, Đỗ Dự, Khương Ngập. Chinese Text Project có bản Công Dương
    Truyện, Ẩn Công năm thứ ba tại https://ctext.org/gongyang-zhuan/yin-gong-san-nian nhưng trang đó CHẶN truy cập tự động,
    TÔI KHÔNG ĐỌC TRỰC TIẾP ĐƯỢC. Ghi lại để người duyệt tra tay. Bản Wikipedia đã BỎ, không dùng làm nguồn.

    '
  status: ACTIVE
  notes: "PHÂN BIỆT BA TẦNG, không được trộn:\n  CLASSICAL_RECORD          — sách chép \"ngày Kỷ Tị, mặt trời bị ăn\".\n \
    \                             Sách KHÔNG viết \"22/02/720 trước Công nguyên\".\n  ASTRONOMICAL_CONFIRMATION — thiên văn\
    \ xác nhận có nhật thực thấy được ở nước Lỗ.\n  MODERN_DATE_IDENTIFICATION— việc gán câu chép vào đúng ngày đó là kết\
    \ luận\n                              của nghiên cứu hiện đại, nằm ngoài cả hai tầng trên.\n"
- source_id: SRC-THIENVAN-NHATTHUC
  independence_group: ASTRONOMICAL_EPHEMERIS
  title: Kiểm chứng thiên văn nhật thực 720 trước Công nguyên
  author: tự chạy bằng astronomy-engine
  dynasty_or_year: chạy ngày 2026-08-21
  edition: null
  language: vi
  source_type: DATASET
  url_or_file_reference: https://github.com/cosinekitty/astronomy
  primary_or_secondary: PRIMARY
  edition_certainty: NOT_APPLICABLE
  provenance_note: 'Dò nhật thực toàn cầu quanh tháng 2 năm 720 trước Công nguyên rồi tính hoàn cảnh quan sát tại nước Lỗ
    (35,6 độ Bắc, 117 độ Đông). Kết quả: nhật thực một phần, che 35 phần trăm, đỉnh lúc khoảng 6 giờ 26 giờ địa phương, rơi
    vào NGÀY 22 tháng 2 theo lịch địa phương. Đây là bằng chứng ĐỘC LẬP với mọi thư viện lịch pháp Trung Hoa.

    '
  status: ACTIVE
  notes: Nối sách chép với một ngày tuyệt đối trên trục thời gian.
- source_id: SRC-TMTH-CHEP
  independence_group: CLASSICAL_TEXT
  title: 三命通會 — Tam Mệnh Thông Hội, quyển hai, Luận Đại vận (bản chép số hóa)
  author: Vạn Dân Anh
  dynasty_or_year: Minh
  edition: đối chiếu bản Tứ Khố Toàn Thư số hóa, CHƯA KHÓA ĐƯỢC BẢN IN
  language: zh-Hant
  source_type: CLASSICAL_TEXT_TRANSCRIPTION
  url_or_file_reference: https://www.shidianguji.com/book/SK1610/chapter/1kf5v6ol1vhnp
  primary_or_secondary: PRIMARY
  edition_certainty: TRANSCRIPTION_ONLY
  provenance_note: 'Nguyên văn lấy từ hai bản chép số hóa khác nhau, nội dung phần Luận Đại vận trùng khớp. Chưa khóa được
    quyển in cụ thể.

    '
  status: ACTIVE
  notes: Nêu thang chiết trừ chi tiết mà Uyên Hải Tử Bình không nói.
- source_id: SRC-NASA-5MCSE
  independence_group: ASTRONOMICAL_EPHEMERIS
  title: NASA Five Millennium Catalog of Solar Eclipses, -1999 tới +3000
  author: Fred Espenak, Jean Meeus
  dynasty_or_year: '2009'
  edition: NASA/TP-2009-214174
  language: en
  source_type: DATASET
  url_or_file_reference: https://eclipse.gsfc.nasa.gov/SEpubs/5MCSE.html
  primary_or_secondary: SECONDARY
  edition_certainty: NOT_APPLICABLE
  provenance_note: 'TÔI CHƯA ĐỌC ĐƯỢC MỤC CỤ THỂ cho ngày -0719 tháng 2. Chỉ xác nhận được danh mục này tồn tại, phủ khoảng
    thời gian cần, và dùng tinh lịch VSOP87 cùng ELP2000-82. QUAN TRỌNG: vì dùng CÙNG BỘ TINH LỊCH với astronomy-engine, nguồn
    này KHÔNG phải bằng chứng độc lập với phép tính của tôi. Cùng một nhóm. Ghi vào đây để người duyệt tra tay mục -0719 nếu
    muốn.

    '
  status: PENDING
  notes: Chờ đọc được mục cụ thể mới chuyển sang ACTIVE.
- source_id: SRC-YTLIU-LICHPHAP
  independence_group: ACADEMIC_CALENDAR_RESEARCH
  title: Yuk Tung Liu — 中國曆法, trang 六十干支 và bộ đổi số ngày Julius
  author: Yuk Tung Liu
  dynasty_or_year: 2018, sửa lớn 2019
  edition: bản web
  language: zh-Hant
  source_type: ARTICLE
  url_or_file_reference: https://ytliu0.github.io/ChineseCalendar/sexagenary_chinese.html
  primary_or_secondary: SECONDARY
  edition_certainty: NOT_APPLICABLE
  provenance_note: 'Cài đặt học thuật, có nêu rõ công thức và mốc neo, ĐỘC LẬP với sxtwl và lunar-python. Công thức: T = 1
    + mod(JD - 1, 10), B = 1 + mod(JD + 1, 12), mốc neo JD 2458511 (27 tháng 1 năm 2019) là ngày Giáp Tý.

    '
  status: ACTIVE
  notes: Đã kiểm 20000 ngày ngẫu nhiên trải 1200 năm, không lệch ngày nào.
- source_id: SRC-BANG-DOI-SAU
  independence_group: MODERN_PRACTITIONER_LITERATURE
  title: Bảng Tàng Can lưu hành trong giới hành nghề đời sau
  author: null
  dynasty_or_year: không xác định, phổ biến từ thế kỷ 20
  edition: null
  language: zh
  source_type: ARTICLE
  url_or_file_reference: nhiều bản trên mạng, nội dung bảng trùng nhau
  primary_or_secondary: SECONDARY
  edition_certainty: TRANSCRIPTION_ONLY
  provenance_note: 'Khẩu quyết đời sau: 子中單癸水，丑藏己癸辛。寅中甲丙戊，卯中乙木藏。 辰藏戊乙癸，巳藏丙戊庚。午中丁己土，未中己丁乙。申裡庚壬戊， 酉中獨辛金。戌裡戊辛丁，亥中壬甲藏。 Nhiều bản
    khác nhau nhưng CÙNG MỘT DÒNG TRUYỀN, nên chỉ tính là MỘT bằng chứng, không phải nhiều.

    '
  status: ACTIVE
  notes: 'TẬP CAN trùng khớp hoàn toàn với Uyên Hải Tử Bình ở cả 12 Chi. THỨ TỰ khác ở 5 Chi. Dùng để đối chiếu, không dùng
    làm nguồn chính.

    '
- source_id: SRC-CHUA-CO-NGUON
  independence_group: NONE
  title: CHƯA CÓ NGUỒN — quy ước đang dùng tạm để hệ thống chạy được
  author: null
  dynasty_or_year: null
  edition: null
  language: vi
  source_type: OTHER
  url_or_file_reference: null
  primary_or_secondary: SECONDARY
  edition_certainty: NOT_APPLICABLE
  status: PENDING
  notes: 'Bản ghi này CỐ Ý không phải một cuốn sách. Nó đánh dấu những quy ước đang chạy mà chưa truy được về nguồn cổ điển.
    Mọi quy tắc gắn với nó không được đưa vào tính điểm chính thức.

    '
- source_id: SRC-DOI-CHIEU-HD
  independence_group: MODERN_CALENDAR_IMPLEMENTATION
  title: Đối chiếu bằng hai cài đặt hiện đại (sxtwl và lunar-python)
  author: null
  dynasty_or_year: 2017 tới nay
  edition: null
  language: zh
  source_type: DATASET
  url_or_file_reference: https://pypi.org/project/sxtwl/ ; https://pypi.org/project/lunar-python/
  primary_or_secondary: SECONDARY
  edition_certainty: NOT_APPLICABLE
  status: ACTIVE
  notes: 'CHỈ dùng để đối chiếu, KHÔNG được dùng làm nguồn chính. Hai thư viện này cùng xuất phát từ một truyền thống nên
    sự trùng khớp của chúng không phải hai bằng chứng độc lập. Đối chiếu thực tế: 8 trên 8 thời điểm khớp hoàn toàn với Engine.

    '
- source_id: SRC-ZPZQ-NLC-SCAN
  independence_group: CLASSICAL_TEXT
  title: 子平真詮 — Tử Bình Chân Thuyên, bản scan thư viện (quyển chứa nguyên văn)
  author: Thẩm Hiếu Chiêm (沈孝瞻)
