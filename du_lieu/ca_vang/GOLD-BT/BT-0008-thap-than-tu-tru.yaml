  ĐẦU VÀO LÀ MỘT TỨ TRỤ CÓ THẬT, không phải mảnh ghép rời.
  Tứ trụ này lấy từ ca vàng CAL-0001 ĐÃ ĐƯỢC DUYỆT: sinh 1990-02-04 lúc 12:00
